<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SatQuery AI – Landing Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070913; color: #f1f5f9; font-family: system-ui, sans-serif; }
    .sidebar-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.85rem; border-radius: 0.75rem; font-size: 0.75rem; color: #94a3b8; text-decoration: none; width: 100%; text-align: left; transition: all 0.2s ease; }
    .sidebar-btn:hover { background: rgba(15, 23, 42, 0.8); color: #f1f5f9; }
    .sidebar-btn.active { background: rgba(59, 130, 246, 0.25); color: #60a5fa; border-left: 3px solid #3b82f6; font-weight: 600; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between p-8 text-center bg-slate-950">
  <header class="flex justify-between items-center max-w-5xl mx-auto w-full">
    <div class="flex items-center gap-3"><span class="text-2xl">🛰️</span><span class="font-bold text-lg text-white">SatQuery AI</span></div>
    <a href="workspace.html" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl">Open Workspace ➜</a>
  </header>
  <main class="max-w-3xl mx-auto space-y-6">
    <span class="text-xs uppercase bg-blue-500/10 border border-blue-500/30 text-blue-400 px-3.5 py-1 rounded-full font-semibold">SIH26167 Prototype</span>
    <h1 class="text-4xl md:text-6xl font-black text-white leading-tight">Talk to Earth. <br/><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">Discover What Satellites See.</span></h1>
    <p class="text-slate-400 text-sm max-w-xl mx-auto">Ask anything in normal text. Our AI analyzes satellite images and gives intelligent answers and insights.</p>
    <a href="workspace.html" class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-8 py-3.5 rounded-xl shadow-lg">Explore Workspace ➜</a>
  </main>
  <footer class="text-[11px] text-slate-500">Connected to FastAPI Backend</footer>
</body>
</html>
