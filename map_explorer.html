  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    body { background-color: #070913; color: #f1f5f9; font-family: system-ui, sans-serif; }
    .sidebar-btn { display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 0.85rem; border-radius: 0.75rem; font-size: 0.75rem; color: #94a3b8; text-decoration: none; width: 100%; text-align: left; transition: all 0.2s ease; }

    .leaflet-container { background: #050811 !important; }
  </style>
</head>
<body class="h-screen flex flex-col bg-slate-950 text-slate-200 overflow-hidden">
  <header class="h-16 border-b border-slate-800 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3"><span class="text-xl">🗺️</span><span class="font-bold text-white">3. Smart Map Explorer</span></div>
    <a href="workspace.html" class="px-4 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold">Workspace ➜</a>

  <div class="flex flex-1 overflow-hidden">
    <aside class="w-64 border-r border-slate-800/80 bg-slate-950 p-4 space-y-1 text-xs shrink-0 flex flex-col justify-between overflow-y-auto">
      <div class="space-y-1">
        <div class="px-3 py-2 text-[10px] uppercase font-bold text-slate-500 tracking-wider">NAVIGATION</div>

    <main class="flex-1 p-5"><div id="exp-map" class="w-full h-full rounded-2xl border border-slate-800"></div></main>
  </div>
  <script>
    const map = L.map('exp-map', { zoomControl: false }).setView([19.0760, 72.8777], 12);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' }).addTo(map);
